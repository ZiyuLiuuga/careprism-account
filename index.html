<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarePrism</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #1d1d1f;
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } }
  .ok { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; background: #00c805; color: #fff; font-size: 34px; line-height: 64px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { color: #8e8e93; margin: 4px 16px; }
</style>
</head>
<body>
  <div>
    <div class="ok">✓</div>
    <h1>邮箱已确认 · Email confirmed</h1>
    <p>请回到 CarePrism app 登录。</p>
    <p>Go back to the CarePrism app and sign in.</p>
  </div>
</body>
</html>
